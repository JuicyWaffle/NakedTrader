# NakedTrader — Configuratie
# Secrets staan in .env (niet hier)

# ── Modus ─────────────────────────────────────
paper_mode: true              # true = simuleer, false = echte orders

# ── Kapitaal ──────────────────────────────────
total_capital: 10000.0        # startkapitaal in EUR

# ── Kelly instellingen ────────────────────────
kelly_fraction: 0.5           # 0.5 = half-Kelly (veiliger)
max_position_pct: 0.20        # max 20% van kapitaal per trade

# ── Risicobeheer ──────────────────────────────
stop_loss_pct: 0.05           # stop-loss bij 5% verlies
take_profit_pct: 0.15         # take-profit bij 15% winst
max_open_positions: 5         # max gelijktijdige posities

# ── Logboek ───────────────────────────────────
trade_log_path: trades.json

# ── Interactive Brokers ───────────────────────
ibkr_host: "127.0.0.1"
ibkr_port: 4001               # 4001 = Gateway paper, 4002 = Gateway live (TWS: 7497/7496)
ibkr_client_id: 1

# ── Crypto broker ─────────────────────────────
crypto_broker: kraken          # "kraken" of "binance"

# ── Binance ───────────────────────────────────
binance_testnet: true          # true zolang je aan het testen bent

# ── Loop ──────────────────────────────────────
interval_seconds: 60           # seconden tussen polling rondes
