<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NakedTrader — Strategieen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00ff88;
    --text: #c8c8d8;
    --text-dim: #55556a;
    --text-bright: #eeeef8;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(10px);
  }

  .logo {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    color: #000;
    font-size: 14px;
    flex-shrink: 0;
    text-decoration: none;
  }

  .header-title {
    flex: 1;
  }

  header h1 {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  header p {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  nav {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }

  nav a {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  nav a:hover {
    color: var(--text);
    border-color: var(--border);
  }

  nav a.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(0,255,136,0.05);
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

  main {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 32px;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .strategies-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
  }

  .strategy-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.2s;
  }

  .strategy-card:hover {
    border-color: #2a2a3e;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .strategy-name {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-bright);
    flex: 1;
  }

  .status-badge {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 4px;
  }

  .status-badge.active {
    color: var(--accent);
    background: rgba(0,255,136,0.1);
    border: 1px solid rgba(0,255,136,0.2);
  }

  .status-badge.inactive {
    color: var(--text-dim);
    background: rgba(85,85,106,0.1);
    border: 1px solid rgba(85,85,106,0.2);
  }

  .card-description {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }

  .card-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .card-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    min-width: 70px;
  }

  .return-range {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }

  .return-range.has-negative {
    color: #ffaa44;
  }

  /* Risk bar */
  .risk-bar-container {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .risk-bar {
    display: flex;
    gap: 3px;
    flex: 1;
    max-width: 120px;
  }

  .risk-segment {
    height: 6px;
    border-radius: 2px;
    flex: 1;
    background: #1a1a24;
  }

  .risk-segment.filled-1 { background: #00ff88; }
  .risk-segment.filled-2 { background: #88ff44; }
  .risk-segment.filled-3 { background: #ffcc00; }
  .risk-segment.filled-4 { background: #ff8844; }
  .risk-segment.filled-5 { background: #ff4466; }

  .risk-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
  }

  /* Tags */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(30,30,46,0.8);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .tag.market {
    color: var(--accent);
    border-color: rgba(0,255,136,0.15);
    background: rgba(0,255,136,0.05);
  }

  .tag.indicator {
    color: #0088ff;
    border-color: rgba(0,136,255,0.15);
    background: rgba(0,136,255,0.05);
  }

  .meta-row {
    display: flex;
    gap: 16px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .meta-item .meta-label {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .meta-item .meta-value {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ── Macro Risk Panel ───────────────────── */
  .macro-risk-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 20px;
    align-items: center;
  }

  .risk-score-meter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 80px;
  }

  .risk-score-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    border: 3px solid;
  }

  .risk-score-circle.green { color: #00ff88; border-color: #00ff88; background: rgba(0,255,136,0.08); }
  .risk-score-circle.orange { color: #ffaa44; border-color: #ffaa44; background: rgba(255,170,68,0.08); }
  .risk-score-circle.red { color: #ff4466; border-color: #ff4466; background: rgba(255,68,102,0.08); }

  .risk-level-badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 4px;
  }

  .risk-level-badge.green { color: #00ff88; background: rgba(0,255,136,0.1); }
  .risk-level-badge.orange { color: #ffaa44; background: rgba(255,170,68,0.1); }
  .risk-level-badge.red { color: #ff4466; background: rgba(255,68,102,0.1); }

  .risk-details {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .risk-details-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-bright);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .risk-mults {
    display: flex;
    gap: 16px;
  }

  .risk-mult {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .risk-mult .mult-label {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .risk-mult .mult-value {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-bright);
  }

  .risk-alerts {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .risk-alert {
    font-family: var(--mono);
    font-size: 11px;
    color: #ffaa44;
    padding: 2px 0;
  }

  .risk-quality {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .quality-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 3px;
    vertical-align: middle;
  }

  .quality-dot.ok { background: #00ff88; }
  .quality-dot.degraded { background: #ffaa44; }
  .quality-dot.fail { background: #ff4466; }

  .quality-item {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
  }

  .risk-data-quality {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 140px;
  }

  .risk-data-quality .dq-title {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  /* ── Money Management rows in cards ──── */
  .mm-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }

  .mm-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .mm-item .mm-label {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .mm-item .mm-value {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-bright);
  }

  /* Adaptive metrics */
  .adaptive-row {
    display: flex;
    gap: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .adaptive-metric {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }

  .adaptive-metric .metric-label {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .adaptive-metric .metric-value {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
  }

  .metric-value.good { color: var(--accent); }
  .metric-value.warn { color: #ffaa44; }
  .metric-value.bad { color: #ff4466; }
  .metric-value.neutral { color: var(--text); }

  .cooldown-badge {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 3px;
    color: #ff4466;
    background: rgba(255,68,102,0.1);
    border: 1px solid rgba(255,68,102,0.2);
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">NT</a>
  <div class="header-title">
    <h1>NakedTrader</h1>
    <p>Strategy Overview</p>
  </div>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/virtual-bank">Virtual Bank</a>
    <a href="/strategies" class="active">Strategieen</a>
  </nav>
  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="last-update">laden...</span>
  </div>
</header>

<main>
  <div class="section-label">Macro Risico</div>
  <div class="macro-risk-panel" id="macro-risk-panel">
    <div class="loading">Risico laden...</div>
  </div>

  <div class="section-label" style="margin-top:24px">Trading strategieen</div>
  <div class="strategies-grid" id="strategies-grid">
    <div class="loading">Strategieen laden...</div>
  </div>
</main>

<script>
async function loadAll() {
  // Load all data in parallel
  const [stratRes, adaptRes, mmRes, riskRes] = await Promise.all([
    fetch('/api/strategies').catch(() => null),
    fetch('/api/adaptive').catch(() => null),
    fetch('/api/money-management').catch(() => null),
    fetch('/api/macro-risk').catch(() => null),
  ]);

  // Parse results
  let strategies = [];
  let adaptive = {};
  let mm = {};
  let risk = null;

  try { strategies = (await stratRes.json()).strategies || []; } catch(e) {}
  try { adaptive = (await adaptRes.json()).adaptive || {}; } catch(e) {}
  try { mm = await mmRes.json(); } catch(e) {}
  try { risk = await riskRes.json(); } catch(e) {}

  renderMacroRisk(risk);
  renderStrategies(strategies, adaptive, mm);

  document.getElementById('last-update').textContent =
    'update: ' + new Date().toLocaleTimeString('nl-BE', {hour:'2-digit', minute:'2-digit'});
}

function renderMacroRisk(risk) {
  const panel = document.getElementById('macro-risk-panel');
  if (!risk || risk.error) {
    panel.innerHTML = '<div class="loading">Macro risk niet beschikbaar</div>';
    return;
  }

  const level = risk.risk_level || 'green';
  const score = (risk.risk_score || 0).toFixed(2);
  const kellyMult = (risk.kelly_mult || 1.0).toFixed(2);
  const slMult = (risk.sl_mult || 1.0).toFixed(2);

  // Alerts
  const alerts = (risk.alerts || []).map(a =>
    '<div class="risk-alert">' + esc(a) + '</div>'
  ).join('') || '<div class="risk-alert" style="color:var(--accent)">Geen actieve waarschuwingen</div>';

  // Data quality
  const dq = risk.data_quality || {};
  const qualityItems = Object.entries(dq).map(([k, v]) => {
    const dotClass = v === true || v === 'ok' ? 'ok' : v === 'degraded' ? 'degraded' : 'fail';
    return '<span class="quality-item"><span class="quality-dot ' + dotClass + '"></span>' + esc(k) + '</span>';
  }).join('');

  panel.innerHTML = `
    <div class="risk-score-meter">
      <div class="risk-score-circle ${level}">${score}</div>
      <span class="risk-level-badge ${level}">${level.toUpperCase()}</span>
    </div>
    <div class="risk-details">
      <div class="risk-details-title">Macro Risk Monitor</div>
      <div class="risk-mults">
        <div class="risk-mult">
          <span class="mult-label">Kelly mult</span>
          <span class="mult-value">&times;${kellyMult}</span>
        </div>
        <div class="risk-mult">
          <span class="mult-label">SL mult</span>
          <span class="mult-value">&times;${slMult}</span>
        </div>
        <div class="risk-mult">
          <span class="mult-label">Noodrem</span>
          <span class="mult-value" style="color:${risk.emergency_brake ? '#ff4466' : 'var(--accent)'}">${risk.emergency_brake ? 'ACTIEF' : 'Uit'}</span>
        </div>
      </div>
      <div class="risk-alerts">${alerts}</div>
    </div>
    <div class="risk-data-quality">
      <span class="dq-title">Databronnen</span>
      <div class="risk-quality">${qualityItems || '<span class="quality-item">Geen data</span>'}</div>
    </div>
  `;
}

async function loadStrategies() {
  // Legacy fallback — loadAll() is preferred
  loadAll();
}

function renderStrategies(strategies, adaptive, mm) {
  const grid = document.getElementById('strategies-grid');
  grid.innerHTML = '';

  const kellyFrac = mm.kelly_fraction || 0.5;
  const maxPosPct = mm.max_position_pct || 0.20;
  const mmStrats = mm.strategies || {};

  strategies.forEach(s => {
    const card = document.createElement('div');
    card.className = 'strategy-card';

    const returnMin = s.expected_return_min;
    const returnMax = s.expected_return_max;
    const hasNegative = returnMin < 0;
    const returnClass = hasNegative ? 'return-range has-negative' : 'return-range';
    const returnText = (returnMin < 0 ? '' : '+') + returnMin + '% — +' + returnMax + '%';

    // Risk bar segments
    let riskSegments = '';
    for (let i = 1; i <= 5; i++) {
      const filled = i <= s.risk_score ? ' filled-' + i : '';
      riskSegments += '<div class="risk-segment' + filled + '"></div>';
    }

    // Market tags
    const marketTags = s.markets.map(m =>
      '<span class="tag market">' + esc(m) + '</span>'
    ).join('');

    // Indicator tags
    const indicatorTags = s.indicators.map(ind =>
      '<span class="tag indicator">' + esc(ind) + '</span>'
    ).join('');

    const statusClass = s.active ? 'active' : 'inactive';
    const statusText = s.active ? 'Actief' : 'Inactief';

    // Adaptive metrics
    const a = adaptive[s.id] || {};
    const winRate = a.rolling_win_rate != null ? (a.rolling_win_rate * 100).toFixed(1) : '—';
    const sharpe = a.rolling_sharpe != null ? a.rolling_sharpe.toFixed(2) : '—';
    const trades = a.trades_count != null ? a.trades_count : 0;
    const inCooldown = a.in_cooldown || false;

    const wrClass = a.rolling_win_rate >= 0.55 ? 'good' : a.rolling_win_rate >= 0.45 ? 'neutral' : a.rolling_win_rate != null ? 'bad' : 'neutral';
    const shClass = a.rolling_sharpe >= 1.0 ? 'good' : a.rolling_sharpe >= 0 ? 'neutral' : a.rolling_sharpe != null ? 'bad' : 'neutral';
    const cooldownHtml = inCooldown ? ' <span class="cooldown-badge">Cooldown</span>' : '';

    // Money management per strategie
    const smm = mmStrats[s.id] || {};
    const budgetPct = ((smm.risk_budget_pct || 0) * 100).toFixed(0);
    const slPct = ((smm.stop_loss_pct || 0.05) * 100).toFixed(1);
    const tpPct = ((smm.take_profit_pct || 0.10) * 100).toFixed(1);

    card.innerHTML = `
      <div class="card-header">
        <span class="color-dot" style="background:${s.color};box-shadow:0 0 6px ${s.color}40"></span>
        <span class="strategy-name">${esc(s.name)}</span>
        <span class="status-badge ${statusClass}">${statusText}</span>
        ${cooldownHtml}
      </div>

      <div class="card-description">${esc(s.description_nl)}</div>

      <div class="adaptive-row">
        <div class="adaptive-metric">
          <span class="metric-label">Win Rate</span>
          <span class="metric-value ${wrClass}">${winRate}%</span>
        </div>
        <div class="adaptive-metric">
          <span class="metric-label">Sharpe</span>
          <span class="metric-value ${shClass}">${sharpe}</span>
        </div>
        <div class="adaptive-metric">
          <span class="metric-label">Trades</span>
          <span class="metric-value neutral">${trades}</span>
        </div>
      </div>

      <div class="mm-row">
        <div class="mm-item">
          <span class="mm-label">Risk Budget</span>
          <span class="mm-value">${budgetPct}%</span>
        </div>
        <div class="mm-item">
          <span class="mm-label">Stop-Loss</span>
          <span class="mm-value">${slPct}%</span>
        </div>
        <div class="mm-item">
          <span class="mm-label">Take-Profit</span>
          <span class="mm-value">${tpPct}%</span>
        </div>
      </div>

      <div class="card-row">
        <span class="card-label">Rendement</span>
        <span class="${returnClass}">${returnText} /jaar</span>
      </div>

      <div class="card-row">
        <span class="card-label">Risico</span>
        <div class="risk-bar-container">
          <div class="risk-bar">${riskSegments}</div>
          <span class="risk-label">${esc(s.risk_level)} (${s.risk_score}/5)</span>
        </div>
      </div>

      <div class="card-row">
        <span class="card-label">Markten</span>
        <div class="tags">${marketTags}</div>
      </div>

      <div class="card-row">
        <span class="card-label">Indicatoren</span>
        <div class="tags">${indicatorTags}</div>
      </div>

      <div class="meta-row">
        <div class="meta-item">
          <span class="meta-label">Timeframe</span>
          <span class="meta-value">${esc(s.timeframe)}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Broker</span>
          <span class="meta-value">${esc(s.broker.toUpperCase())}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Kelly</span>
          <span class="meta-value">${(kellyFrac * 100).toFixed(0)}% (max ${(maxPosPct * 100).toFixed(0)}%)</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadAll();
</script>
</body>
</html>
