<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NakedTrader — Performance Analyser</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00ff88;
    --text: #c8c8d8;
    --text-dim: #55556a;
    --text-bright: #eeeef8;
    --red: #ff4466;
    --orange: #ffaa44;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative; z-index: 1;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    background: rgba(10,10,15,0.9); backdrop-filter: blur(10px);
  }
  .logo {
    width: 36px; height: 36px;
    background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; color: #000; font-size: 14px;
    flex-shrink: 0; text-decoration: none;
  }
  header h1 {
    font-family: var(--mono); font-size: 14px; font-weight: 600;
    color: var(--text-bright); letter-spacing: 0.05em; text-transform: uppercase;
  }
  header p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  nav { display: flex; gap: 4px; margin-left: auto; margin-right: 16px; }
  nav a {
    font-family: var(--mono); font-size: 11px; text-decoration: none;
    padding: 6px 14px; border-radius: 6px; border: 1px solid transparent; transition: all 0.2s;
  }
  nav a.active { color: var(--accent); border-color: var(--accent); background: rgba(0,255,136,0.05); }
  nav a:not(.active) { color: var(--text-dim); }
  nav a:not(.active):hover { color: var(--text); border-color: var(--border); }
  .status-bar {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 6px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

  main {
    position: relative; z-index: 1;
    max-width: 1400px; margin: 0 auto; padding: 28px 32px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .section-label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-dim);
    margin-bottom: 6px;
  }

  .date-label {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    margin-top: -4px;
  }

  /* ── Bot cards grid ── */
  .bot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 16px;
  }

  .bot-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    display: flex; flex-direction: column; gap: 14px;
    transition: border-color 0.2s;
  }
  .bot-card:hover { border-color: #2a2a3e; }
  .bot-card.cooldown { border-color: rgba(255,170,68,0.3); }

  /* Card header */
  .bc-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .bc-name {
    font-family: var(--mono); font-size: 14px; font-weight: 700;
    color: var(--text-bright);
  }
  .bc-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; margin-right: 8px;
    flex-shrink: 0;
  }
  .bc-tags { display: flex; gap: 6px; }
  .bc-tag {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--border); color: var(--text-dim);
  }
  .bc-tag.cooldown-tag {
    color: var(--orange); border-color: rgba(255,170,68,0.3);
    background: rgba(255,170,68,0.05);
  }

  /* Trade volume row */
  .bc-trades {
    display: flex; gap: 24px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .bc-trade-item { display: flex; flex-direction: column; gap: 2px; }
  .bc-trade-label {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
  }
  .bc-trade-val {
    font-family: var(--mono); font-size: 16px; font-weight: 700;
    color: var(--text-bright);
  }
  .bc-trade-val.muted { color: var(--text-dim); font-size: 14px; }

  /* Returns row */
  .bc-returns {
    display: flex; gap: 0;
  }
  .bc-return-item {
    flex: 1;
    display: flex; flex-direction: column; gap: 2px;
    padding: 0 8px;
    border-right: 1px solid var(--border);
  }
  .bc-return-item:first-child { padding-left: 0; }
  .bc-return-item:last-child { border-right: none; padding-right: 0; }
  .bc-return-label {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
  }
  .bc-return-val {
    font-family: var(--mono); font-size: 15px; font-weight: 700;
  }

  /* Metrics row */
  .bc-metrics {
    display: flex; gap: 16px;
  }
  .bc-metric {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  }
  .bc-metric b { color: var(--text); font-weight: 600; }

  /* Analysis text */
  .bc-analysis {
    font-family: var(--sans); font-size: 12px; line-height: 1.6;
    color: var(--text); padding: 12px 14px;
    background: rgba(10,10,15,0.5);
    border-radius: 8px; border: 1px solid var(--border);
  }
  .bc-analysis strong {
    color: var(--orange); font-weight: 600;
  }

  .positive { color: var(--accent); }
  .negative { color: var(--red); }
  .neutral { color: var(--text-dim); }

  .loading-msg {
    font-family: var(--mono); font-size: 12px; color: var(--text-dim);
    padding: 40px; text-align: center;
  }

  @media (max-width: 860px) {
    .bot-grid { grid-template-columns: 1fr; }
    .bc-trades { flex-wrap: wrap; gap: 12px; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">NT</a>
  <div>
    <h1>NakedTrader</h1>
    <p>Performance Analyser</p>
  </div>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/virtual-bank">Virtual Bank</a>
    <a href="/strategies">Strategieen</a>
    <a href="/performance" class="active">Performance</a>
    <a href="/assets">Assets</a>
    <a href="/blitz">Blitz</a>
  </nav>
  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="last-update">laden...</span>
  </div>
</header>

<main>
  <div>
    <div class="section-label">Performance Analyser</div>
    <div class="date-label" id="date-label">Laden...</div>
  </div>

  <div class="bot-grid" id="bot-grid">
    <div class="loading-msg">Analyse wordt geladen...</div>
  </div>
</main>

<script>
const BOT_COLORS = {
  'momentum': '#00ff88', 'mean-reversion': '#0088ff', 'breakout': '#ff4466',
  'trend-follow': '#ffaa44', 'arbitrage': '#aa44ff',
};

async function loadPerformance() {
  try {
    const res = await fetch('/api/performance/analysis');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    document.getElementById('date-label').textContent =
      'Referentiedag: ' + (data.date || '—');

    const grid = document.getElementById('bot-grid');
    grid.innerHTML = '';

    const order = ['momentum', 'mean-reversion', 'breakout', 'trend-follow', 'arbitrage'];
    const botIds = order.filter(id => data.bots[id]);
    // Add any extra bots not in the order
    Object.keys(data.bots).forEach(id => { if (!botIds.includes(id)) botIds.push(id); });

    if (botIds.length === 0) {
      grid.innerHTML = '<div class="loading-msg">Geen botdata beschikbaar.</div>';
      return;
    }

    botIds.forEach(sid => {
      const bot = data.bots[sid];
      const color = BOT_COLORS[sid] || '#888';
      const card = document.createElement('div');
      card.className = 'bot-card' + (bot.in_cooldown ? ' cooldown' : '');

      // Format returns
      const fmtRet = v => {
        const pct = (v * 100).toFixed(2);
        const cls = v > 0 ? 'positive' : v < 0 ? 'negative' : 'neutral';
        const sign = v > 0 ? '+' : '';
        return `<span class="${cls}">${sign}${pct}%</span>`;
      };

      // Parse analysis text — convert **text** to <strong>text</strong>
      const analysisHtml = esc(bot.analysis).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      card.innerHTML = `
        <div class="bc-header">
          <div style="display:flex;align-items:center">
            <span class="bc-dot" style="background:${color};box-shadow:0 0 6px ${color}"></span>
            <span class="bc-name">${esc(bot.name)}</span>
          </div>
          <div class="bc-tags">
            <span class="bc-tag">${esc(bot.timeframe)}</span>
            <span class="bc-tag">${esc(bot.broker)}</span>
            ${bot.in_cooldown ? '<span class="bc-tag cooldown-tag">Cooldown</span>' : ''}
          </div>
        </div>

        <div class="bc-trades">
          <div class="bc-trade-item">
            <span class="bc-trade-label">Verwacht / dag</span>
            <span class="bc-trade-val">${bot.expected_trades_per_day}</span>
          </div>
          <div class="bc-trade-item">
            <span class="bc-trade-label">Effectief gisteren</span>
            <span class="bc-trade-val ${bot.actual_trades_yesterday === 0 ? 'muted' : ''}">${bot.actual_trades_yesterday}</span>
          </div>
          <div class="bc-trade-item">
            <span class="bc-trade-label">Totaal trades</span>
            <span class="bc-trade-val muted">${bot.trades_total}</span>
          </div>
        </div>

        <div class="bc-returns" title="Rendement = som dagelijkse realized P&L / startkapitaal × 100. Enkel afgesloten trades.">
          <div class="bc-return-item">
            <span class="bc-return-label" title="Realized P&L van gisteren">1 dag ℹ️</span>
            <span class="bc-return-val">${fmtRet(bot.return_1d)}</span>
          </div>
          <div class="bc-return-item">
            <span class="bc-return-label" title="Som realized P&L laatste 30 dagen">1 maand</span>
            <span class="bc-return-val">${fmtRet(bot.return_1m)}</span>
          </div>
          <div class="bc-return-item">
            <span class="bc-return-label" title="Som realized P&L laatste 90 dagen">3 maanden</span>
            <span class="bc-return-val">${fmtRet(bot.return_3m)}</span>
          </div>
        </div>

        <div class="bc-metrics">
          <div class="bc-metric">Win rate: <b>${(bot.win_rate * 100).toFixed(0)}%</b></div>
          <div class="bc-metric">Sharpe: <b>${bot.sharpe.toFixed(2)}</b></div>
          <div class="bc-metric">Verliezen op rij: <b>${bot.consecutive_losses}</b></div>
        </div>

        <div class="bc-analysis">${analysisHtml}</div>
      `;
      grid.appendChild(card);
    });

    document.getElementById('last-update').textContent =
      'update: ' + new Date().toLocaleTimeString('nl-BE', {hour:'2-digit', minute:'2-digit'});

  } catch (e) {
    console.error('Performance load error:', e);
    document.getElementById('bot-grid').innerHTML =
      '<div class="loading-msg">Fout bij laden: ' + esc(e.message) + '</div>';
  }
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadPerformance();
setInterval(loadPerformance, 60000);
</script>
</body>
</html>
