# NakedTrader — Configuratie
# Secrets staan in .env (niet hier)

# ── Modus ─────────────────────────────────────
paper_mode: true              # true = simuleer, false = echte orders

# ── Kapitaal ──────────────────────────────────
total_capital: 10000.0        # startkapitaal in EUR

# ── Kelly instellingen ────────────────────────
kelly_fraction: 0.5           # 0.5 = half-Kelly (veiliger)
max_position_pct: 0.20        # max 20% van kapitaal per trade

# ── Risicobeheer ──────────────────────────────
stop_loss_pct: 0.05           # stop-loss bij 5% verlies
take_profit_pct: 0.10         # take-profit bij 10% winst
max_open_positions: 5         # max gelijktijdige posities
drawdown_limit_pct: 0.15     # halt alle handel bij 15% drawdown van peak

# ── Logboek ───────────────────────────────────
trade_log_path: trades.json

# ── Adaptive state ────────────────────────────
state_path: strategy_state.json

# ── Interactive Brokers ───────────────────────
ibkr_host: "127.0.0.1"
ibkr_port: 4002               # 4002 = Gateway paper, 4001 = Gateway live (TWS: 7497/7496)
ibkr_client_id: 1

# ── Crypto broker ─────────────────────────────
crypto_broker: kraken          # "kraken" of "binance"

# ── Binance ───────────────────────────────────
binance_testnet: true          # true zolang je aan het testen bent

# ── Macro Risk ───────────────────────────────
macro_risk_enabled: true       # geopolitieke risicobewaking
macro_risk_interval_min: 60    # hercheck elke 60 minuten
macro_risk_veto_threshold: 0.85 # noodrem bij score >= 0.85

# ── Ollama AI ───────────────────────────────
ollama_enabled: true            # AI-verrijking via lokale Ollama
ollama_url: "http://localhost:11434"

# ── Loop ──────────────────────────────────────
interval_seconds: 60           # seconden tussen polling rondes
