<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NakedTrader — Blitz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Space+Grotesk:wght@300;400;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #00ff88;
    --text: #c8c8d8;
    --text-dim: #55556a;
    --text-bright: #eeeef8;
    --red: #ff4466;
    --orange: #ffaa44;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative; z-index: 1;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    background: rgba(10,10,15,0.9); backdrop-filter: blur(10px);
  }
  .logo {
    width: 36px; height: 36px;
    background: var(--accent); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; color: #000; font-size: 14px;
    flex-shrink: 0; text-decoration: none;
  }
  header h1 {
    font-family: var(--mono); font-size: 14px; font-weight: 600;
    color: var(--text-bright); letter-spacing: 0.05em; text-transform: uppercase;
  }
  header p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  nav { display: flex; gap: 4px; margin-left: auto; margin-right: 16px; }
  nav a {
    font-family: var(--mono); font-size: 11px; text-decoration: none;
    padding: 6px 14px; border-radius: 6px; border: 1px solid transparent; transition: all 0.2s;
  }
  nav a.active { color: var(--accent); border-color: var(--accent); background: rgba(0,255,136,0.05); }
  nav a:not(.active) { color: var(--text-dim); }
  nav a:not(.active):hover { color: var(--text); border-color: var(--border); }
  .status-bar {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 6px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

  main {
    position: relative; z-index: 1;
    max-width: 1400px; margin: 0 auto; padding: 28px 32px;
    display: flex; flex-direction: column; gap: 24px;
  }

  .section-label {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-dim);
    margin-bottom: 10px;
  }

  /* ── Budget input row ── */
  .budget-row {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px;
  }
  .budget-row label {
    font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text-bright);
  }
  .budget-input {
    font-family: var(--mono); font-size: 18px; font-weight: 700;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--accent); padding: 10px 16px; width: 160px;
    outline: none; transition: border-color 0.2s;
  }
  .budget-input:focus { border-color: var(--accent); }
  .blitz-btn {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    background: var(--accent); color: #000; border: none; border-radius: 8px;
    padding: 12px 28px; cursor: pointer; transition: all 0.2s;
  }
  .blitz-btn:hover { box-shadow: 0 0 20px rgba(0,255,136,0.3); transform: translateY(-1px); }
  .blitz-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .blitz-status {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    margin-left: auto;
  }

  /* ── Macro risk card ── */
  .macro-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 24px; display: flex; align-items: center; gap: 24px;
  }
  .macro-level {
    font-family: var(--mono); font-size: 14px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    padding: 6px 16px; border-radius: 6px;
  }
  .macro-level.green { color: var(--accent); border: 1px solid rgba(0,255,136,0.3); background: rgba(0,255,136,0.08); }
  .macro-level.orange { color: var(--orange); border: 1px solid rgba(255,170,68,0.3); background: rgba(255,170,68,0.08); }
  .macro-level.red { color: var(--red); border: 1px solid rgba(255,68,102,0.3); background: rgba(255,68,102,0.08); }
  .macro-stat {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  }
  .macro-stat b { color: var(--text); font-weight: 600; }
  .macro-alerts {
    font-family: var(--mono); font-size: 10px; color: var(--orange);
    margin-left: auto; max-width: 400px; text-align: right;
  }

  /* ── Advice cards grid ── */
  .advice-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px;
  }
  .advice-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.2s;
  }
  .advice-card:hover { border-color: rgba(0,255,136,0.2); }
  .ac-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .ac-symbol {
    font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--text-bright);
  }
  .ac-direction {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 3px 10px; border-radius: 4px;
  }
  .ac-direction.long { color: var(--accent); border: 1px solid rgba(0,255,136,0.3); background: rgba(0,255,136,0.08); }
  .ac-direction.short { color: var(--red); border: 1px solid rgba(255,68,102,0.3); background: rgba(255,68,102,0.08); }
  .ac-strategy {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  }
  .ac-metrics {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    border-top: 1px solid var(--border); padding-top: 12px;
  }
  .ac-metric {
    display: flex; flex-direction: column; gap: 2px;
  }
  .ac-metric-label {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
  }
  .ac-metric-value {
    font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text-bright);
  }

  /* ── Return estimates ── */
  .ac-returns {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    border-top: 1px solid var(--border); padding-top: 12px;
  }
  .ac-return-block {
    background: rgba(0,255,136,0.03); border: 1px solid rgba(0,255,136,0.08);
    border-radius: 8px; padding: 10px;
  }
  .ac-return-label {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
    margin-bottom: 4px;
  }
  .ac-return-expected {
    font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--accent);
  }
  .ac-return-range {
    font-family: var(--mono); font-size: 9px; color: var(--text-dim); margin-top: 2px;
  }

  /* ── AI reasoning ── */
  .ac-reasoning {
    font-family: var(--sans); font-size: 12px; color: var(--text);
    line-height: 1.5; border-top: 1px solid var(--border); padding-top: 10px;
    font-style: italic;
  }

  /* ── Execute button ── */
  .ac-footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: auto;
  }
  .ac-risk-badge {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 3px 10px; border-radius: 4px;
  }
  .ac-risk-badge.low { color: var(--accent); border: 1px solid rgba(0,255,136,0.2); }
  .ac-risk-badge.medium { color: var(--orange); border: 1px solid rgba(255,170,68,0.2); }
  .ac-risk-badge.high { color: var(--red); border: 1px solid rgba(255,68,102,0.2); }
  .exec-btn {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 6px; padding: 8px 20px; cursor: pointer; transition: all 0.2s;
  }
  .exec-btn:hover { background: rgba(0,255,136,0.1); }
  .exec-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .exec-btn.executed { color: var(--text-dim); border-color: var(--border); }
  .exec-btn.blocked { color: var(--red); border-color: var(--red); }

  /* ── Execution result ── */
  .exec-result {
    font-family: var(--mono); font-size: 10px; padding: 6px 10px;
    border-radius: 4px; margin-top: 8px;
  }
  .exec-result.success { color: var(--accent); background: rgba(0,255,136,0.06); border: 1px solid rgba(0,255,136,0.15); }
  .exec-result.blocked { color: var(--red); background: rgba(255,68,102,0.06); border: 1px solid rgba(255,68,102,0.15); }
  .exec-result.error { color: var(--orange); background: rgba(255,170,68,0.06); border: 1px solid rgba(255,170,68,0.15); }

  /* ── Empty state ── */
  .empty-state {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 48px 24px; text-align: center;
    font-family: var(--mono); font-size: 13px; color: var(--text-dim);
  }

  /* ── Loading ── */
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 800px) {
    .budget-row { flex-wrap: wrap; }
    .advice-grid { grid-template-columns: 1fr; }
    .macro-card { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">NT</a>
  <div>
    <h1>NakedTrader</h1>
    <p>Blitz Advies</p>
  </div>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/virtual-bank">Virtual Bank</a>
    <a href="/strategies">Strategieen</a>
    <a href="/performance">Performance</a>
    <a href="/assets">Assets</a>
    <a href="/blitz" class="active">Blitz</a>
  </nav>
  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="last-update">laden...</span>
  </div>
</header>

<main>

  <!-- Budget input -->
  <div>
    <div class="section-label">Blitzadvies</div>
    <div class="budget-row">
      <label for="budget">Budget:</label>
      <input type="number" id="budget" class="budget-input" value="500" min="10" step="50">
      <button class="blitz-btn" id="blitz-btn" onclick="requestAdvice()">Blitzadvies</button>
      <span class="blitz-status" id="blitz-status"></span>
    </div>
  </div>

  <!-- Macro risk -->
  <div id="macro-section" style="display:none">
    <div class="section-label">Marktcondities</div>
    <div class="macro-card" id="macro-card"></div>
  </div>

  <!-- Advice cards -->
  <div id="advice-section" style="display:none">
    <div class="section-label" id="advice-label">Advies</div>
    <div class="advice-grid" id="advice-grid"></div>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="empty-state">
    Vul een budget in en klik op Blitzadvies om de beste investeringsmogelijkheden te zien.
  </div>

</main>

<script>
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatEur(v) {
  return '\u20AC' + v.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function requestAdvice() {
  const btn = document.getElementById('blitz-btn');
  const status = document.getElementById('blitz-status');
  const budget = parseFloat(document.getElementById('budget').value) || 500;

  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span>Signalen verzamelen...';

  try {
    const res = await fetch('/api/blitz/advice?budget=' + budget);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderAdvice(data);
    status.textContent = 'Klaar — ' + new Date().toLocaleTimeString('nl-BE', {hour:'2-digit', minute:'2-digit'});
  } catch (e) {
    status.textContent = 'Fout: ' + e.message;
    status.style.color = 'var(--red)';
  } finally {
    btn.disabled = false;
  }
}

function renderAdvice(data) {
  // Macro risk card
  const macroSection = document.getElementById('macro-section');
  const macroCard = document.getElementById('macro-card');
  const m = data.macro_risk;

  macroCard.innerHTML = `
    <span class="macro-level ${esc(m.risk_level)}">${esc(m.risk_level)}</span>
    <span class="macro-stat">Risk score: <b>${m.risk_score.toFixed(2)}</b></span>
    <span class="macro-stat">Kelly mult: <b>${m.kelly_mult.toFixed(2)}</b></span>
    ${m.emergency_brake ? '<span class="macro-stat" style="color:var(--red);font-weight:700">NOODREM ACTIEF</span>' : ''}
    <span class="macro-alerts">${(m.alerts || []).slice(0, 3).map(a => esc(a)).join(' | ')}</span>
  `;
  macroSection.style.display = '';

  // Advice cards
  const adviceSection = document.getElementById('advice-section');
  const grid = document.getElementById('advice-grid');
  const emptyState = document.getElementById('empty-state');
  const label = document.getElementById('advice-label');

  if (!data.advice || data.advice.length === 0) {
    grid.innerHTML = '';
    adviceSection.style.display = 'none';
    emptyState.style.display = '';
    emptyState.textContent = 'Geen signalen gevonden op dit moment. Probeer later opnieuw.';
    return;
  }

  emptyState.style.display = 'none';
  adviceSection.style.display = '';
  label.textContent = `Advies (${data.advice.length} signalen) — Budget ${formatEur(data.budget)}`;

  grid.innerHTML = data.advice.map((item, idx) => {
    const r1m = item.return_1m;
    const r3m = item.return_3m;
    const riskClass = item.risk_level === 'high' ? 'high' : (item.risk_level === 'medium' ? 'medium' : 'low');

    return `
      <div class="advice-card" id="card-${idx}">
        <div class="ac-header">
          <div>
            <span class="ac-symbol">${esc(item.symbol)}</span>
            <span class="ac-strategy">${esc(item.strategy_name)}</span>
          </div>
          <span class="ac-direction ${item.direction}">${esc(item.direction)}</span>
        </div>

        <div class="ac-metrics">
          <div class="ac-metric">
            <span class="ac-metric-label">Prijs</span>
            <span class="ac-metric-value">${formatEur(item.current_price)}</span>
          </div>
          <div class="ac-metric">
            <span class="ac-metric-label">Positiegrootte</span>
            <span class="ac-metric-value">${formatEur(item.size_eur)}</span>
          </div>
          <div class="ac-metric">
            <span class="ac-metric-label">Win-kans</span>
            <span class="ac-metric-value">${(item.win_probability * 100).toFixed(0)}%</span>
          </div>
          <div class="ac-metric">
            <span class="ac-metric-label">Broker</span>
            <span class="ac-metric-value">${esc(item.broker)}</span>
          </div>
        </div>

        <div class="ac-returns">
          <div class="ac-return-block">
            <div class="ac-return-label">Rendement 1 maand</div>
            <div class="ac-return-expected">${r1m.expected >= 0 ? '+' : ''}${formatEur(r1m.expected)}</div>
            <div class="ac-return-range">${formatEur(r1m.min)} — ${formatEur(r1m.max)}</div>
          </div>
          <div class="ac-return-block">
            <div class="ac-return-label">Rendement 3 maanden</div>
            <div class="ac-return-expected">${r3m.expected >= 0 ? '+' : ''}${formatEur(r3m.expected)}</div>
            <div class="ac-return-range">${formatEur(r3m.min)} — ${formatEur(r3m.max)}</div>
          </div>
        </div>

        ${item.ai_reasoning ? `<div class="ac-reasoning">${esc(item.ai_reasoning)}</div>` : ''}

        <div class="ac-footer">
          <span class="ac-risk-badge ${riskClass}">${esc(item.risk_level)} risk</span>
          <button class="exec-btn" id="exec-${idx}" onclick="executeAdvice(${idx})">Uitvoeren</button>
        </div>
        <div id="exec-result-${idx}"></div>
      </div>
    `;
  }).join('');

  // Store advice data for execution
  window._blitzAdvice = data.advice;
}

async function executeAdvice(idx) {
  const item = window._blitzAdvice[idx];
  if (!item) return;

  const btn = document.getElementById('exec-' + idx);
  const resultDiv = document.getElementById('exec-result-' + idx);
  btn.disabled = true;
  btn.textContent = 'Bezig...';

  try {
    const res = await fetch('/api/blitz/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        symbol: item.symbol,
        strategy_id: item.strategy_id,
        direction: item.direction,
        current_price: item.current_price,
        size_eur: item.size_eur,
        broker: item.broker,
        win_probability: item.win_probability,
        expected_win_pct: item.expected_win_pct,
        expected_loss_pct: item.expected_loss_pct,
      }),
    });
    const data = await res.json();

    if (data.decision === 'executed') {
      btn.textContent = 'Uitgevoerd';
      btn.className = 'exec-btn executed';
      resultDiv.innerHTML = `<div class="exec-result success">Uitgevoerd: ${formatEur(data.size_executed || 0)} via Orchestrator ${esc(data.orchestrator_id || 'A')}</div>`;
    } else if (data.decision === 'blocked') {
      btn.textContent = 'Geblokkeerd';
      btn.className = 'exec-btn blocked';
      resultDiv.innerHTML = `<div class="exec-result blocked">Geblokkeerd: ${esc(data.reason || '')} (${esc(data.rule_triggered || '')})</div>`;
    } else if (data.error) {
      btn.textContent = 'Fout';
      btn.className = 'exec-btn blocked';
      resultDiv.innerHTML = `<div class="exec-result error">Fout: ${esc(data.error)}</div>`;
    } else {
      btn.textContent = data.decision || 'Onbekend';
      btn.className = 'exec-btn';
      resultDiv.innerHTML = `<div class="exec-result error">${esc(data.reason || 'Onbekend resultaat')}</div>`;
    }
  } catch (e) {
    btn.textContent = 'Fout';
    btn.className = 'exec-btn blocked';
    resultDiv.innerHTML = `<div class="exec-result error">Fout: ${esc(e.message)}</div>`;
  }
}

document.getElementById('last-update').textContent =
  'update: ' + new Date().toLocaleTimeString('nl-BE', {hour:'2-digit', minute:'2-digit'});
</script>
</body>
</html>
